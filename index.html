<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CSRE Punchlist">
<meta name="theme-color" content="#0F2645">
<title>CSRE Punchlist</title>
<style>
  :root {
    --navy:      #0F2645;
    --navy-mid:  #1A3A6B;
    --navy-lt:   #2A5298;
    --navy-pale: #E8EEF8;
    --bg:        #F2F5FB;
    --surface:   #FFFFFF;
    --surface2:  #EBF0F9;
    --border:    #C8D4E8;
    --border2:   #A8BCE0;
    --text:      #0F2645;
    --muted:     #5A6E8C;
    --hint:      #8FA3C0;
    --green:     #1B6B3A;
    --green-bg:  #E2F5EB;
    --amber:     #7A4800;
    --amber-bg:  #FFF0D6;
    --red:       #8B1F1F;
    --red-bg:    #FCEAEA;
    --r:         12px;
    --r-sm:      8px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html { height: 100%; }
  body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.4;
    /* Prevent elastic scroll bounce showing white */
    overscroll-behavior: none;
  }

  /* ─── Shell layout ─────────────────────────────────────── */
  .shell {
    display: flex;
    flex-direction: column;
    height: 100%;
    height: 100dvh; /* dynamic viewport height — accounts for iOS browser bars */
  }

  /* ─── Top bar ──────────────────────────────────────────── */
  .topbar {
    flex-shrink: 0;
    background: var(--navy);
    color: #fff;
    padding: 0 1rem;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    /* Safe area for notch/dynamic island */
    padding-top: env(safe-area-inset-top);
    height: calc(54px + env(safe-area-inset-top));
  }
  .brand { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .brand em { color: #7EB3F0; font-style: normal; font-weight: 400; }
  .role-pill {
    font-size: 13px; padding: 6px 14px; border-radius: 20px;
    border: 1px solid rgba(126,179,240,0.4); color: rgba(255,255,255,0.65);
    cursor: pointer; white-space: nowrap; background: transparent;
  }
  .role-pill.admin { border-color: #7EB3F0; color: #7EB3F0; }

  /* ─── Scroll area ──────────────────────────────────────── */
  .body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    position: relative;
    padding: 1rem 0.875rem 6rem;
  }

  /* ─── Skyline watermark ────────────────────────────────── */
  .skyline {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 180px;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .skyline svg { position: absolute; bottom: 0; width: 100%; height: 100%; }
  .body > *:not(.skyline) { position: relative; z-index: 1; }

  /* ─── Stats ────────────────────────────────────────────── */
  .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 1rem; }
  .stat { background: var(--navy); border-radius: var(--r); padding: 0.75rem 0.875rem; }
  .stat-label { font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
  .stat-val { font-size: 28px; font-weight: 700; color: #fff; line-height: 1; }

  /* ─── Tabs ─────────────────────────────────────────────── */
  .tabs { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 1rem; }
  .tab { flex: 1; padding: 12px; font-size: 16px; font-weight: 500; border: none; background: transparent; color: var(--muted); cursor: pointer; border-right: 1px solid var(--border); }
  .tab:last-child { border-right: none; }
  .tab.active { background: var(--navy); color: #fff; }

  /* ─── Filter chips ─────────────────────────────────────── */
  .chips { display: flex; gap: 7px; margin-bottom: 1rem; overflow-x: auto; padding-bottom: 3px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { padding: 7px 16px; font-size: 14px; border: 1px solid var(--border); border-radius: 20px; background: var(--surface); color: var(--muted); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }

  /* ─── Ticket cards ─────────────────────────────────────── */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
  .card.done { opacity: 0.6; }
  .card-head { padding: 1rem 1rem 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-title { font-size: 17px; font-weight: 600; line-height: 1.3; flex: 1; color: var(--navy); }
  .card.done .card-title { text-decoration: line-through; }
  .pdot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .ph { background: #D94040; } .pm { background: #E09020; } .pl { background: #2E8B57; }
  .card-meta { padding: 5px 1rem 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  .tid { font-size: 12px; color: var(--hint); }
  .card-desc { padding: 6px 1rem 0; font-size: 15px; color: var(--muted); line-height: 1.5; }
  .card-notes { margin: 8px 1rem 0; background: var(--navy-pale); border-radius: var(--r-sm); padding: 9px 11px; font-size: 13px; color: var(--navy-mid); white-space: pre-wrap; line-height: 1.6; border-left: 3px solid var(--navy-lt); }
  .card-bar { padding: 0.7rem 0.75rem 0.8rem; display: flex; align-items: center; gap: 7px; margin-top: 9px; border-top: 1px solid var(--border); background: var(--surface2); flex-wrap: wrap; }

  /* ─── Status select ────────────────────────────────────── */
  .s-sel { font-size: 15px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); color: var(--muted); padding: 9px 10px; cursor: pointer; flex: 1; min-width: 100px; font-family: inherit; }

  /* ─── Action buttons ───────────────────────────────────── */
  .abtn { height: 42px; padding: 0 14px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); cursor: pointer; font-size: 15px; white-space: nowrap; font-family: inherit; }
  .abtn:active { opacity: 0.7; }
  .abtn.note    { color: var(--navy-lt); border-color: var(--border2); background: var(--navy-pale); }
  .abtn.done    { color: var(--green);   border-color: #A8D8BC; background: var(--green-bg); }
  .abtn.del     { color: var(--red);     border-color: #E8B8B8; background: var(--red-bg); }
  .abtn.restore { color: var(--navy-lt); border-color: var(--border2); background: var(--navy-pale); }

  /* ─── Badges ───────────────────────────────────────────── */
  .badge { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
  .bo { background: var(--navy-pale); color: var(--navy-lt); }
  .bi { background: var(--amber-bg);  color: var(--amber); }
  .bd { background: var(--green-bg);  color: var(--green); }

  /* ─── FAB ──────────────────────────────────────────────── */
  .fab {
    position: fixed; right: 1.25rem;
    bottom: calc(1.25rem + env(safe-area-inset-bottom));
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--navy-lt); color: #fff; border: none;
    font-size: 28px; cursor: pointer; display: none;
    align-items: center; justify-content: center;
    box-shadow: 0 4px 18px rgba(15,38,69,.38); z-index: 45;
  }

  /* ─── Sheet modals ─────────────────────────────────────── */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(8,20,45,.6); z-index: 100; align-items: flex-end; justify-content: center; }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--surface); border-radius: var(--r) var(--r) 0 0;
    padding: 1.25rem 1.125rem;
    padding-bottom: calc(2rem + env(safe-area-inset-bottom));
    width: 100%; max-width: 560px; max-height: 92dvh; overflow-y: auto;
  }
  .handle { width: 38px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 1.1rem; }
  .sheet-title { font-size: 19px; font-weight: 700; color: var(--navy); margin-bottom: 1rem; }
  .field { margin-bottom: 0.875rem; }
  .field label { display: block; font-size: 14px; color: var(--muted); font-weight: 500; margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 13px 14px; font-size: 17px;
    border: 1px solid var(--border); border-radius: var(--r-sm);
    background: var(--bg); color: var(--text); font-family: inherit;
    -webkit-appearance: none;
  }
  .field textarea { height: 96px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--navy-lt); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sheet-foot { display: flex; gap: 9px; margin-top: 1.25rem; }
  .btn { flex: 1; padding: 15px; font-size: 17px; font-weight: 600; border-radius: var(--r-sm); border: 1px solid var(--border); cursor: pointer; font-family: inherit; }
  .btn-ghost { background: var(--surface2); color: var(--muted); }
  .btn-primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .btn-primary:disabled { opacity: .5; cursor: default; }

  /* ─── PIN sheet ────────────────────────────────────────── */
  .pin-sheet { text-align: center; }
  .pin-sheet h2 { font-size: 20px; font-weight: 700; color: var(--navy); margin-bottom: .4rem; }
  .pin-sheet p { font-size: 15px; color: var(--muted); margin-bottom: 1.1rem; }
  .pin-input {
    width: 100%; text-align: center; font-size: 34px; letter-spacing: .35em;
    padding: 14px; border: 1px solid var(--border); border-radius: var(--r-sm);
    background: var(--bg); color: var(--navy); font-family: inherit;
    margin-bottom: .75rem; -webkit-appearance: none;
  }
  .pin-err { font-size: 14px; color: var(--red); min-height: 20px; margin-bottom: .5rem; }

  /* ─── Empty / loading ──────────────────────────────────── */
  .empty { text-align: center; padding: 3.5rem 0; color: var(--hint); font-size: 16px; }
  .empty-icon { font-size: 36px; margin-bottom: 10px; }
  .loading { text-align: center; padding: 3rem; color: var(--hint); font-size: 16px; }

  /* ─── Toast ────────────────────────────────────────────── */
  .toast {
    position: fixed; bottom: calc(5rem + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    background: var(--navy); color: #fff; font-size: 15px;
    padding: 11px 20px; border-radius: 20px; z-index: 300;
    opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ─── Error banner ─────────────────────────────────────── */
  .err-banner { background: var(--red-bg); border: 1px solid #E8B8B8; border-radius: var(--r); padding: 1rem; color: var(--red); font-size: 14px; line-height: 1.5; margin-bottom: 1rem; }
  .err-banner strong { display: block; margin-bottom: .25rem; }
</style>
</head>
<body>

<!-- ─── Shell ─────────────────────────────────────────────── -->
<div class="shell">

  <header class="topbar">
    <div class="brand">CSRE <em>Punchlist</em></div>
    <button class="role-pill" id="role-pill" onclick="promptAdmin()">Handyman</button>
  </header>

  <main class="body">

    <div class="stats">
      <div class="stat"><div class="stat-label">Open</div><div class="stat-val" id="cnt-open">—</div></div>
      <div class="stat"><div class="stat-label">In progress</div><div class="stat-val" id="cnt-prog">—</div></div>
      <div class="stat"><div class="stat-label">Done</div><div class="stat-val" id="cnt-done">—</div></div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-active" onclick="switchTab('active')">Active</button>
      <button class="tab" id="tab-done" onclick="switchTab('done')">Done</button>
    </div>

    <div id="panel-active">
      <div class="chips">
        <button class="chip on"  onclick="setFilter('all',this)">All</button>
        <button class="chip"     onclick="setFilter('open',this)">Open</button>
        <button class="chip"     onclick="setFilter('inprog',this)">In progress</button>
        <button class="chip"     onclick="setFilter('high',this)">⚠ High priority</button>
      </div>
      <div class="list" id="list-active"></div>
    </div>

    <div id="panel-done" style="display:none;">
      <div class="list" id="list-done"></div>
    </div>

  </main>

</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="openNew()" aria-label="New ticket">+</button>

<!-- PIN sheet -->
<div class="overlay" id="ov-pin" onclick="outsideClose(event,'ov-pin')">
  <div class="sheet pin-sheet">
    <div class="handle"></div>
    <h2>Admin access</h2>
    <p>Enter the manager PIN</p>
    <input class="pin-input" type="password" inputmode="numeric" maxlength="8"
           id="pin-input" placeholder="••••" onkeydown="if(event.key==='Enter')checkPin()">
    <div class="pin-err" id="pin-err"></div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" onclick="closeSheet('ov-pin')">Cancel</button>
      <button class="btn btn-primary" onclick="checkPin()">Unlock</button>
    </div>
  </div>
</div>

<!-- New ticket sheet -->
<div class="overlay" id="ov-new" onclick="outsideClose(event,'ov-new')">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-title">New ticket</div>
    <div class="field"><label>Title *</label><input type="text" id="n-title" placeholder="e.g. Replace ceiling tile Unit 14B"></div>
    <div class="field"><label>Property / location</label><input type="text" id="n-loc" placeholder="e.g. 100 Oak St, Lot 14"></div>
    <div class="field"><label>Description</label><textarea id="n-desc" placeholder="Additional details…"></textarea></div>
    <div class="two">
      <div class="field"><label>Priority</label>
        <select id="n-pri"><option value="high">High</option><option value="med" selected>Medium</option><option value="low">Low</option></select>
      </div>
      <div class="field"><label>Reported by</label><input type="text" id="n-reporter" placeholder="Tenant name"></div>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" onclick="closeSheet('ov-new')">Cancel</button>
      <button class="btn btn-primary" id="btn-create" onclick="submitNew()">Create ticket</button>
    </div>
  </div>
</div>

<!-- Note sheet -->
<div class="overlay" id="ov-note" onclick="outsideClose(event,'ov-note')">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-title">Add note</div>
    <div class="field"><label>Note</label><textarea id="note-txt" placeholder="Update, parts needed, observation…" style="height:110px"></textarea></div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" onclick="closeSheet('ov-note')">Cancel</button>
      <button class="btn btn-primary" id="btn-note" onclick="submitNote()">Save note</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────────────────────────
// CONFIG — paste your Apps Script web app URL here
// ─────────────────────────────────────────────────────────────
const API = 'https://script.google.com/u/0/home/projects/1Wi0foIzLsB89wjPR-ZllVKsfV7BDBGtS4kP_XoPXcX9FGxLBOQnIC0cO/edit';
// ─────────────────────────────────────────────────────────────

let tickets = [], isAdmin = false, curTab = 'active', curFilter = 'all', noteId = null;

// ── API — all calls use GET to avoid CORS issues ─────────────
async function api(params) {
  const url = API + '?' + new URLSearchParams(params);
  const r = await fetch(url, { redirect: 'follow' });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'API error');
  return j.data;
}

// ── Boot ─────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  if (API === 'YOUR_APPS_SCRIPT_URL_HERE') {
    document.getElementById('list-active').innerHTML =
      '<div class="err-banner"><strong>Setup required</strong>Open index.html and replace YOUR_APPS_SCRIPT_URL_HERE with your deployed Apps Script URL.</div>';
    return;
  }
  loadTickets();
});

async function loadTickets() {
  document.getElementById('list-active').innerHTML = '<div class="loading">Loading…</div>';
  try {
    tickets = await api({ action: 'tickets' });
    render();
  } catch(e) {
    document.getElementById('list-active').innerHTML =
      `<div class="err-banner"><strong>Could not load tickets</strong>${e.message}</div>`;
  }
}

// ── Admin / PIN ──────────────────────────────────────────────
function promptAdmin() {
  if (isAdmin) { isAdmin = false; updateRole(); render(); return; }
  document.getElementById('pin-input').value = '';
  document.getElementById('pin-err').textContent = '';
  openSheet('ov-pin');
  setTimeout(() => document.getElementById('pin-input').focus(), 80);
}

async function checkPin() {
  const pin = document.getElementById('pin-input').value;
  try {
    const ok = await api({ action: 'verify', pin });
    if (ok) {
      isAdmin = true;
      closeSheet('ov-pin');
      updateRole(); render(); toast('Admin mode unlocked');
    } else {
      document.getElementById('pin-err').textContent = 'Incorrect PIN';
      document.getElementById('pin-input').value = '';
      document.getElementById('pin-input').focus();
    }
  } catch(e) { document.getElementById('pin-err').textContent = e.message; }
}

function updateRole() {
  const p = document.getElementById('role-pill');
  p.textContent = isAdmin ? 'Admin ✕' : 'Handyman';
  p.className = 'role-pill' + (isAdmin ? ' admin' : '');
  document.getElementById('fab').style.display = isAdmin ? 'flex' : 'none';
}

// ── Tabs / filters ───────────────────────────────────────────
function switchTab(tab) {
  curTab = tab;
  document.getElementById('panel-active').style.display = tab === 'active' ? '' : 'none';
  document.getElementById('panel-done').style.display   = tab === 'done'   ? '' : 'none';
  document.getElementById('tab-active').className = 'tab' + (tab === 'active' ? ' active' : '');
  document.getElementById('tab-done').className   = 'tab' + (tab === 'done'   ? ' active' : '');
}

function setFilter(f, el) {
  curFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  renderActive();
}

// ── Render ───────────────────────────────────────────────────
function render() {
  const active = tickets.filter(t => !t.archived);
  const done   = tickets.filter(t =>  t.archived);
  document.getElementById('cnt-open').textContent = active.filter(t => t.status === 'open').length;
  document.getElementById('cnt-prog').textContent = active.filter(t => t.status === 'inprog').length;
  document.getElementById('cnt-done').textContent = done.length;
  renderActive(); renderDone();
}

function renderActive() {
  let list = tickets.filter(t => !t.archived);
  if (curFilter === 'open')   list = list.filter(t => t.status === 'open');
  if (curFilter === 'inprog') list = list.filter(t => t.status === 'inprog');
  if (curFilter === 'high')   list = list.filter(t => t.priority === 'high');
  const el = document.getElementById('list-active');
  el.innerHTML = list.length ? list.map(t => cardHtml(t, false)).join('') :
    '<div class="empty"><div class="empty-icon">📋</div>No tickets here</div>';
}

function renderDone() {
  const list = tickets.filter(t => t.archived);
  const el = document.getElementById('list-done');
  el.innerHTML = list.length ? list.map(t => cardHtml(t, true)).join('') :
    '<div class="empty"><div class="empty-icon">✅</div>Nothing in the done pile yet</div>';
}

function cardHtml(t, isDone) {
  const badge = t.status === 'open'   ? '<span class="badge bo">Open</span>'
              : t.status === 'inprog' ? '<span class="badge bi">In progress</span>'
              :                         '<span class="badge bd">Done</span>';
  const pdot = `<span class="pdot p${t.priority[0]}"></span>`;
  const loc  = t.location ? `<span>📍 ${esc(t.location)}</span>` : '';
  const rep  = t.reporter ? `<span>👤 ${esc(t.reporter)}</span>` : '';
  const tid  = `<span class="tid">#${t.id} · ${ago(t.created)}</span>`;
  const notes = t.notes ? `<div class="card-notes">${esc(t.notes)}</div>` : '';

  const sel = isDone ? '' : `
    <select class="s-sel" onchange="doStatus(${t.id},this.value)">
      <option value="open"   ${t.status==='open'   ?'selected':''}>Open</option>
      <option value="inprog" ${t.status==='inprog' ?'selected':''}>In progress</option>
    </select>`;

  const noteBtn = `<button class="abtn note" onclick="openNote(${t.id})">✎ Note</button>`;

  const adminBtns = isAdmin && !isDone
    ? `<button class="abtn done"    onclick="doDone(${t.id})">✓ Done</button>
       <button class="abtn del"     onclick="doDel(${t.id})">✕</button>` : '';

  const restoreBtns = isAdmin && isDone
    ? `<button class="abtn restore" onclick="doRestore(${t.id})">↩ Restore</button>
       <button class="abtn del"     onclick="doDel(${t.id})">✕</button>` : '';

  return `<div class="card${isDone?' done':''}">
    <div class="card-head"><div class="card-title">${esc(t.title)}</div>${pdot}</div>
    <div class="card-meta">${badge}${loc}${rep}${tid}</div>
    ${t.desc ? `<div class="card-desc">${esc(t.desc)}</div>` : ''}
    ${notes}
    <div class="card-bar">${sel}${noteBtn}${adminBtns}${restoreBtns}</div>
  </div>`;
}

// ── Actions ──────────────────────────────────────────────────
async function doStatus(id, status) {
  try {
    await api({ action: 'updateStatus', id, status });
    const t = tickets.find(x => x.id == id);
    if (t) t.status = status;
    render(); toast('Status updated');
  } catch(e) { toast('Error: ' + e.message); }
}

function openNote(id) {
  noteId = id;
  document.getElementById('note-txt').value = '';
  openSheet('ov-note');
  setTimeout(() => document.getElementById('note-txt').focus(), 80);
}

async function submitNote() {
  const txt = document.getElementById('note-txt').value.trim();
  if (!txt) return;
  const btn = document.getElementById('btn-note');
  btn.disabled = true;
  try {
    await api({ action: 'addNote', id: noteId, note: txt });
    closeSheet('ov-note');
    await loadTickets();
    toast('Note saved');
  } catch(e) { toast('Error: ' + e.message); }
  btn.disabled = false;
}

async function doDone(id) {
  try {
    await api({ action: 'markDone', id });
    await loadTickets(); toast('Moved to done');
  } catch(e) { toast('Error: ' + e.message); }
}

async function doDel(id) {
  if (!confirm('Delete this ticket permanently?')) return;
  try {
    await api({ action: 'deleteTicket', id });
    tickets = tickets.filter(t => t.id != id);
    render(); toast('Deleted');
  } catch(e) { toast('Error: ' + e.message); }
}

async function doRestore(id) {
  try {
    await api({ action: 'restoreTicket', id });
    await loadTickets(); toast('Ticket restored');
  } catch(e) { toast('Error: ' + e.message); }
}

function openNew() {
  ['n-title','n-loc','n-desc','n-reporter'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('n-pri').value = 'med';
  openSheet('ov-new');
  setTimeout(() => document.getElementById('n-title').focus(), 80);
}

async function submitNew() {
  const title = document.getElementById('n-title').value.trim();
  if (!title) { document.getElementById('n-title').focus(); return; }
  const btn = document.getElementById('btn-create');
  btn.disabled = true;
  try {
    const ticket = {
      title,
      location: document.getElementById('n-loc').value.trim(),
      desc:     document.getElementById('n-desc').value.trim(),
      priority: document.getElementById('n-pri').value,
      reporter: document.getElementById('n-reporter').value.trim()
    };
    await api({ action: 'createTicket', ticket: JSON.stringify(ticket) });
    closeSheet('ov-new');
    await loadTickets();
    toast('Ticket created');
  } catch(e) { toast('Error: ' + e.message); }
  btn.disabled = false;
}

// ── Sheet helpers ────────────────────────────────────────────
function openSheet(id)  { document.getElementById(id).classList.add('open'); }
function closeSheet(id) { document.getElementById(id).classList.remove('open'); }
function outsideClose(e, id) { if (e.target.id === id) closeSheet(id); }

// ── Utils ────────────────────────────────────────────────────
function ago(iso) {
  if (!iso) return '';
  const d = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (d < 1)    return 'just now';
  if (d < 60)   return d + 'm ago';
  if (d < 1440) return Math.floor(d/60) + 'h ago';
  return Math.floor(d/1440) + 'd ago';
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
}
</script>
